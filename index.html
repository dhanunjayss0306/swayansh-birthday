<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>For Jaswant Varma (#45) — Happy Birthday ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap');

:root{
 --crimson:#6e0718;
 --red:#b5172e;
 --bright-red:#e31b38;
 --neon-red:#ff2a4b;
 --blush:#ffe5ea;
 --snow:#fffafb;
 --line:#f2b6c0;
 --gold:#ffb703;
 --text:#3b0a14;
 --shadow:0 22px 65px rgba(110,7,24,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:radial-gradient(circle at top,#a81329,#47030e);
 color:var(--text);
 font-family:"DM Sans",sans-serif;
 overflow-x:hidden;
}

/* Floating celebratory embers/confetti canvas */
#sparkCanvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
 z-index:99;
}

.story{
 width:min(100%,1120px);
 margin:auto;
 background:var(--snow);
 box-shadow:0 0 100px rgba(35,1,8,.65);
 overflow:hidden;
 position:relative;
}
section{
 min-height:100vh;
 display:none;
 position:relative;
 overflow:hidden;
 padding:70px clamp(18px,6vw,75px) 95px;
 align-items:center;
 justify-content:center;
 border-bottom:1px solid var(--line);
}
section.active{display:flex;animation:appear .65s cubic-bezier(.22,1,.36,1)}
@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.inner{width:100%;max-width:940px;margin:auto;text-align:center;position:relative;z-index:4}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--crimson)}
h1{font-size:clamp(48px,8vw,88px);line-height:.92;margin:14px 0}
h2{font-size:clamp(38px,6.5vw,64px);line-height:.98;margin:10px 0 18px}
h3{font-size:28px;margin:0 0 10px}
p{font-size:clamp(16px,2vw,19.5px);line-height:1.75}
.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:700;color:var(--red)}
.script{font-family:"Great Vibes",cursive;font-size:clamp(32px,5vw,52px);color:var(--red)}
.ornament{width:110px;height:1px;background:#e68a99;margin:20px auto;position:relative}
.ornament:before,.ornament:after{position:absolute;top:-14px;font-size:18px;color:var(--red)}
.ornament:before{content:"♥";left:-4px}
.ornament:after{content:"♥";right:-4px}

.btn{
 border:0;
 background:linear-gradient(135deg,var(--crimson),var(--bright-red));
 color:white;
 padding:15px 34px;
 border-radius:30px;
 font:600 16px "DM Sans",sans-serif;
 cursor:pointer;
 margin-top:24px;
 box-shadow:0 12px 28px rgba(181,23,46,.32);
 transition:.25s;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(227,27,56,.42)}
.secondary-btn{background:#fff;color:var(--crimson);border:1px solid #e69aa6}
.secondary-btn:hover{background:#fff0f3;color:var(--crimson)}

.decor{position:absolute;z-index:1;pointer-events:none;color:#d94b61;opacity:.45}
.flower{font-size:38px}.heart{font-size:32px}.balloon{font-size:48px}
.f1{left:4%;top:8%}.f2{right:4%;top:12%}.f3{left:6%;bottom:11%}.f4{right:6%;bottom:10%}
.h1{left:16%;top:14%}.h2{right:16%;top:22%}.h3{left:16%;bottom:16%}.h4{right:15%;bottom:14%}
.b1{left:3%;top:32%}.b2{right:3%;top:38%}

.corner{position:absolute;width:82px;height:82px;border-color:#e38896;border-style:solid;opacity:.75;z-index:2}
.tl{top:24px;left:24px;border-width:1px 0 0 1px}.tr{top:24px;right:24px;border-width:1px 1px 0 0}
.bl{bottom:24px;left:24px;border-width:0 0 1px 1px}.br{bottom:24px;right:24px;border-width:0 1px 1px 0}

/* Hero Section */
.hero{background:radial-gradient(circle at center,#fff,#ffdbe2)}
.hero-photo{
 width:min(330px,70vw);
 aspect-ratio:1;
 margin:24px auto;
 border-radius:50%;
 border:8px solid white;
 box-shadow:0 20px 55px rgba(181,23,46,.28);
 overflow:hidden;
 position:relative;
}
.photo{
 background:linear-gradient(145deg,#fff2f5,#ffdbe2);
 border:1px solid #f0b8c2;
 min-height:260px;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#9e4756;
 font-size:18px;
 font-weight:600;
 overflow:hidden;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* Password Gate Box */
.reveal{background:linear-gradient(135deg,#fff0f3,#ffd5de)}
.auth-box{
 max-width:520px;
 margin:22px auto 0;
 background:#fff;
 padding:28px 24px;
 border-radius:22px;
 border:1px solid #f0b8c2;
 box-shadow:var(--shadow);
}
.auth-question{
 font-family:"Cormorant
